<!doctype html>
<html lang="en">
  <head>

        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "tp6dow982y");
    </script>

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-N97Z02BGG4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-N97Z02BGG4");

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Kahani Korner Story</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;700&family=Authentic+Sans:wght@400;700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="/qr/assets/css/index.css" />
    <link rel="stylesheet" href="/qr/assets/css/story-audio.css" />
  </head>

  <body>
    <header>
      <a href="https://kahanikorner.com/">
        <img
          src="/assets/images/homepage/logo.png"
          alt="Kahani Korner Logo"
          class="logo" />
      </a>
    </header>

    <h1 id="story-title"></h1>

    <div class="container">
      <p class="story-audio-hint">Tap the book cover to play audio</p>
      <button
        type="button"
        class="story-audio-cover"
        id="story-audio-btn"
        aria-label="Play story audio: Aaloo Miyan">
        <span id="book-cover" class="book-placeholder">
          <span class="story-audio-cover__play" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          </span>
        </span>
      </button>
      <div class="level-picker" id="level-picker"></div>
      <div class="button-container" id="button-container"></div>
    </div>

    <script>
      window.STORY_HOME_CONFIG = {
        slug: "aaloo-miyan",
        title: "Aaloo Miyan",
        coverImage: "./images/bookcover.png",
        readAloudHref: "#story-audio",

        orderedWords: [
          "aaloo",
          "sabzi",
          "tokri",
          "darna",
          "baigan",
          "laat",
          "rona",
          "gajar",
          "pyaar",
          "hansna",
          "matar",
          "keera",
        ],

        totalLevels: 5,
        defaultLevel: 1,

        activities: [
          {
            id: "readaloud",
            label: "Read Aloud",
            href: "#story-audio",
            useWordsParam: false,
          },
          {
            id: "flashcards",
            label: "Flashcards",
            href: "/qr/assets/html/flashcards",
            useWordsParam: true,
          },
          {
            id: "matching",
            label: "Picture Match",
            href: "/qr/assets/html/matching",
            useWordsParam: true,
          },
          {
            id: "riddles",
            label: "Riddles",
            href: "/qr/assets/html/riddles",
            useWordsParam: true,
          },
          {
            id: "memory",
            label: "Memory Game",
            href: "/qr/assets/html/memory",
            useWordsParam: true,
          },
          {
            id: "wordsearch",
            label: "Word Search",
            href: "/qr/assets/html/wordsearch",
            useWordsParam: true,
          },
        ],
      };
    </script>

    <script type="module" src="/qr/assets/js/index.js"></script>

    <script>
      const iconSrc = "https://img.icons8.com/color/96/like--v1.png";
      for (let i = 0; i < 15; i++) {
        const icon = document.createElement("img");
        icon.src = iconSrc;
        icon.classList.add("heart");
        icon.style.left = Math.random() * 100 + "vw";
        icon.style.animationDelay = Math.random() * 10 + "s";
        icon.style.width = (16 + Math.random() * 10).toFixed(2) + "px";
        icon.style.animationDuration = (6 + Math.random() * 4).toFixed(2) + "s";
        document.body.appendChild(icon);
      }
    </script>

    <script>
      window.STORY_AUDIO = {
        videoId: "LKK2Qlr8ozY",
        start: 0,
        end: 150,
        title: "Aaloo Miyan",
      };
    </script>
    <script defer src="/qr/assets/js/story-audio.js"></script>
  </body>
</html>
