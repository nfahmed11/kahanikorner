      <div class="level-picker" id="level-picker"></div>
      <div class="button-container" id="button-container"></div>

    <script>
      window.STORY_HOME_CONFIG = {
        slug: "dada-jee-ka-khet",
        title: "Dada Jee Ka Khet",
        coverImage: "./images/bookcover.png",
        readAloudHref: "./video.html",

        orderedWords: [
          "Kutta",
          "Billi",
          "Oont",
          "Hans",
          "Gadha",
          "Khargosh",
          "Turkey",
          "Ghora",
          "Choozay",
          "Bhair",
          "Bakri",
          "Sewr",
          "Murghi",
          "Murgha",
          "Dada Jee",
          "Khet",
          "Batakh",
          "Gaaye",
        ],

        totalLevels: 5,
        defaultLevel: 1,

        activities: [
          {
            id: "readaloud",
            label: "Read Aloud",
            href: "./video.html",
            useWordsParam: false,
          },
          {
            id: "flashcards",
            label: "Flashcards",
            href: "/qr/assets/html/flashcards.html",
            useWordsParam: true,
          },
          {

            useWordsParam: true,

          {

            label: "Memory Game",
            href: "/qr/assets/html/memory.html",
            useWordsParam: true,

    <script type="module" src="/qr/assets/js/index.js"></script>

    <script>
      const iconSrc = "https://img.icons8.com/color/96/like--v1.png";
      for (let i = 0; i < 15; i++) {
        const icon = document.createElement("img");
        icon.src = iconSrc;
        icon.classList.add("heart");
        icon.style.left = Math.random() * 100 + "vw";
        icon.style.animationDelay = Math.random() * 10 + "s";
        icon.style.width = (16 + Math.random() * 10).toFixed(2) + "px";
        icon.style.animationDuration = (6 + Math.random() * 4).toFixed(2) + "s";
        document.body.appendChild(icon);
      }
    </script>

    <iframe
      id="ytplayer"
      src="https://www.youtube.com/embed/ndxitY4eYas?enablejsapi=1&autoplay=1&mute=1&start=0&end=110&loop=1&playlist=ndxitY4eYas"
      title="YouTube video player"
      frameborder="0"
      allow="autoplay; encrypted-media; accelerometer; clipboard-write; gyroscope; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
      style="display:none"
    ></iframe>

    <script>
      let tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);

      let player, loopInterval;

      function onYouTubeIframeAPIReady() {
        player = new YT.Player("ytplayer", {
          events: {
            onReady: () => player.playVideo(),
            onStateChange: onPlayerStateChange,
          },
        });
      }

      function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
          clearInterval(loopInterval);
          loopInterval = setInterval(() => {
            if (player.getCurrentTime() >= 110) player.seekTo(0, true);
          }, 500);
        } else {
          clearInterval(loopInterval);
        }
      }
    </script>
  </body>
