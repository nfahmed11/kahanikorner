    <meta charset="UTF-8" />

    <title>Kahani Korner | Ramadan Hungama</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

        background-image: url("/qr/tkt/2026/0226bef/assets/images/bookcover.png");

  <body>
    <header>
      <a href="https://kahanikorner.com/">
        <img
          src="/assets/images/homepage/logo.png"
          alt="Kahani Korner Logo"
          class="logo" />
      </a>
    </header>

    <h1>Ramadan Hungama</h1>

    <div class="container">
      <div class="book-placeholder"></div>

      <div class="button-container">
        <a id="readaloud-link" href="#" class="button">Read Aloud</a>
        <a id="flashcards-link" href="#" class="button">Flashcards</a>
        <a id="matching-link" href="#" class="button">Picture Match</a>
        <a id="riddles-link" href="#" class="button">Riddles</a>
        <a id="memory-link" href="#" class="button">Memory Game</a>
        <a id="wordsearch-link" href="#" class="button">Word Search</a>
      </div>
    </div>

    <script>
      // One master word list for this specific story/activity bundle
      const STORY_WORDS = [
        "muskurahat",
        "maheena",
        "tayari",
        "roti",
        "khushboo",
        "daura",
        "ami",
        "mubarak",
        "dadi",
        "dada",
        "dua",
        "chacha",
        "dastarkhwan",
        "ailan",
        "hansna",
        "achanak",
        "khabar",
        "aag",
        "khamoshi",
        "parosi",
        "kaam",
        "ghabrana",
        "pakarna",
        "madad",
        "khajoor",
        "pani",
        "saath",
        "aansoo",
        "shukriya",
        "dil",
        "shehar",
        "azan",
        "wapas",
        "khush",
        "pura",
        "awaaz",
        "roza",
        "pyara"
      ];

      const wordsParam = encodeURIComponent(STORY_WORDS.join(","));

      document.getElementById("readaloud-link").href =
        `/qr/assets/html/thekahanitimes.html?words=${wordsParam}`;

      document.getElementById("flashcards-link").href =
        `/qr/assets/html/flashcards.html?words=${wordsParam}`;

      document.getElementById("matching-link").href =
        `/qr/assets/html/matching.html?words=${wordsParam}`;

      document.getElementById("riddles-link").href =
        `/qr/assets/html/riddles.html?words=${wordsParam}`;

      document.getElementById("memory-link").href =
        `/qr/assets/html/memory.html?words=${wordsParam}`;

      document.getElementById("wordsearch-link").href =
        `/qr/assets/html/wordsearch.html?words=${wordsParam}`;
    </script>

    <script>
      // pink heart images from Icons8
      const iconSrc = "https://img.icons8.com/color/96/like--v1.png";

      for (let i = 0; i < 15; i++) {
        const icon = document.createElement("img");
        icon.src = iconSrc;
        icon.classList.add("heart");
        icon.style.left = Math.random() * 100 + "vw";
        icon.style.animationDelay = Math.random() * 10 + "s";
        icon.style.width = (16 + Math.random() * 10).toFixed(2) + "px";
        icon.style.animationDuration = (6 + Math.random() * 4).toFixed(2) + "s";
        document.body.appendChild(icon);
      }
    </script>
