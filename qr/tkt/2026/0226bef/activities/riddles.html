    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <header class="header">
      <a class="home-link" href="https://kahanikorner.com/">Kahani Korner</a>

      <!-- Title is centered and can wrap onto its own row on small screens -->
      <div class="header-title" aria-label="Game title">
        <span id="header-title" class="header-title__text"
          >Main Kaun Hoon?</span
        >
      </div>

      <button
        class="settings-btn"
        id="settings-toggle"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false">
        ⚙️ Settings <span class="arrow" id="settings-arrow">▼</span>
      </button>

      <!-- Desktop dropdown -->
      <div class="settings-dropdown" id="settings-dropdown" aria-hidden="true">
        <div class="difficulty-section">
          <div class="difficulty-slider">
            <div class="difficulty-toprow">
              <span class="difficulty-title">Difficulty</span>
              <span id="difficulty-label" class="difficulty-badge">Hard</span>
            </div>

            <input
              id="difficulty-range"
              type="range"
              min="0"
              max="2"
              step="1"
              value="2"
              aria-label="Difficulty" />

            <div class="difficulty-legend">
              <span>Easy</span>
              <span>Medium</span>
              <span>Hard</span>
            </div>
          </div>
        </div>

        <div class="language-section">
          <label class="language-option">
            <input type="checkbox" id="romanUrdu" checked /> Roman Urdu
          </label>
          <label class="language-option">
            <input type="checkbox" id="urdu" checked /> اردو
          </label>
          <label class="language-option">
            <input type="checkbox" id="english" checked /> English
          </label>
        </div>
      </div>
    </header>

    <!-- Mobile settings modal -->
    <div
      class="settings-modal hidden"
      id="settings-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-modal-title">
      <div class="settings-modal-backdrop" id="settings-modal-backdrop"></div>

      <div class="settings-modal-card" role="document">
        <div class="settings-modal-header">
          <h2 id="settings-modal-title">Settings</h2>
          <button
            class="settings-close"
            id="settings-modal-close"
            type="button"
            aria-label="Close settings">
            ✕
          </button>
        </div>

        <div class="settings-modal-body" id="settings-modal-body"></div>

        <div class="settings-modal-footer">
          <button class="settings-done" id="settings-modal-done" type="button">
            Done
          </button>
        </div>
      </div>
    </div>

    <main class="container">
      <section class="game-area">
        <div class="riddle-container" id="riddle-container"></div>

        <!-- Hard mode / reveal area -->
        <div class="answer-area" id="answer-area"></div>

        <div class="word-options" id="word-options"></div>
      </section>
    </main>
