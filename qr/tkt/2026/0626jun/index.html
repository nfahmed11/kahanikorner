    <script>
      window.STORY_HOME_CONFIG = {
        slug: "ayaan-ke-aam",
        title: "Ayaan ke Aam",
        coverImage: "./assets/images/bookcover.png",
        readAloudHref: "./activities/thekahanitimes.html",

        /*
    ┌────────────────────────────────────────────────────────────────────────┐
    │  AI HELPER PROMPT — use this to generate content for a new issue.     │
    └────────────────────────────────────────────────────────────────────────┘

    Step 1: Split the monthly story into story.lines objects:
      { id, romanUrdu, urdu, english }

    Step 2: Create Fill the Kahani questions using those line IDs in sourceLineIds.
    For each question include:
      id, level, sourceLineIds, missingWords,
      romanUrdu, urdu, english,
      completedRomanUrdu, completedUrdu, completedEnglish,
      choices, answer

    Rules:
    - Use only vocabulary from this story.
    - Make blanks useful content words (nouns, verbs).
    - Keep Roman Urdu beginner-friendly.
    - Urdu script must be correct.
    - English should be a direct translation.
    - answer[] entries must match the ___ blanks left-to-right.
    - Level 1: one blank, 3 choices (auto-check)
    - Level 2: two blanks, word-bank chips
    - Level 3: two sentences, 2–3 blanks, word bank
    - Level 4 (Story Mode): 3–4 sentences, 3–5 blanks, word bank
    */

        story: {
          title: "Safiyah Aur Chaand",
          lines: [
            {
              id: "line-1",
              romanUrdu: "Safiyah Abu ke saath bakra mandi gayi.",
              urdu: "\u0635\u0641\u06cc\u06c1 \u0627\u0628\u0648 \u06a9\u06d2 \u0633\u0627\u062a\u06be \u0628\u06a9\u0631\u06c1 \u0645\u0646\u0688\u06cc \u06af\u0626\u06cc\u06d4",
              english: "Safiyah went to the goat market with Abu.",
            },
            {
              id: "line-2",
              romanUrdu: "Mandi mein bakray, gaayein, aur bheirein khari thin.",
              urdu: "\u0645\u0646\u0688\u06cc \u0645\u06cc\u06ba \u0628\u06a9\u0631\u06d2\u060c \u06af\u0627\u0626\u06cc\u06ba\u060c \u0627\u0648\u0631 \u0628\u06be\u06cc\u0691\u06cc\u06ba \u06a9\u06be\u0691\u06cc \u062a\u06be\u06cc\u06ba\u06d4",
              english: "In the market, goats, cows, and sheep were standing.",
            },
            {
              id: "line-3",
              romanUrdu:
                "Kahin \u201cmeh meh,\u201d kahin ghantiyon ki \u201cchan chan,\u201d aur kahin logon ki baatein sunai de rahi thin.",
              urdu: "\u06a9\u06c1\u06cc\u06ba \u201c\u0645\u06cc\u06ba \u0645\u06cc\u06ba\u201d\u060c \u06a9\u06c1\u06cc\u06ba \u06af\u06be\u0646\u0679\u06cc\u0648\u06ba \u06a9\u06cc \u201c\u0686\u06be\u0646 \u0686\u06be\u0646\u201d\u060c \u0627\u0648\u0631 \u06a9\u06c1\u06cc\u06ba \u0644\u0648\u06af\u0648\u06ba \u06a9\u06cc \u0628\u0627\u062a\u06cc\u06ba \u0633\u0646\u0627\u0626\u06cc \u062f\u06d2 \u0631\u06c1\u06cc \u062a\u06be\u06cc\u06ba\u06d4",
              english:
                "In one place there was \u201cmeh meh,\u201d in another the \u201cchan chan\u201d of bells, and in another the sound of people talking.",
            },
            {
              id: "line-4",
              romanUrdu: "Safiyah ka dil khushi se dhad dhad kar raha tha.",
              urdu: "\u0635\u0641\u06cc\u06c1 \u06a9\u0627 \u062f\u0644 \u062e\u0648\u0634\u06cc \u0633\u06d2 \u062f\u06be\u0691 \u062f\u06be\u0691 \u06a9\u0631 \u0631\u06c1\u0627 \u062a\u06be\u0627\u06d4",
              english: "Safiyah's heart was beating with happiness.",
            },
            {
              id: "line-5",
              romanUrdu: "Phir us ne aik chota sa bakra dekha.",
              urdu: "\u067e\u06be\u0631 \u0627\u0633 \u0646\u06d2 \u0627\u06cc\u06a9 \u0686\u06be\u0648\u0679\u0627 \u0633\u0627 \u0628\u06a9\u0631\u06c1 \u062f\u06cc\u06a9\u06be\u0627\u06d4",
              english: "Then she saw a small goat.",
            },
            {
              id: "line-6",
              romanUrdu:
                "Uski aankhein narm thin, aur uske maathey par safed nishaan bilkul chotay chaand jaisa tha.",
              urdu: "\u0627\u0633 \u06a9\u06cc \u0622\u0646\u06a9\u06be\u06cc\u06ba \u0646\u0631\u0645 \u062a\u06be\u06cc\u06ba\u060c \u0627\u0648\u0631 \u0627\u0633 \u06a9\u06d2 \u0645\u0627\u062a\u06be\u06d2 \u067e\u0631 \u0633\u0641\u06cc\u062f \u0646\u0634\u0627\u0646 \u0628\u0627\u0644\u06a9\u0644 \u0686\u06be\u0648\u0679\u06d2 \u0686\u0627\u0646\u062f \u062c\u06cc\u0633\u0627 \u062a\u06be\u0627\u06d4",
              english:
                "Its eyes were gentle, and the white mark on its forehead was just like a little moon.",
            },
            {
              id: "line-7",
              romanUrdu:
                "Safiyah ne Abu ka haath pakar kar kaha, \u201cAbu, kya hum isay ghar le ja saktay hain?\u201d",
              urdu: "\u0635\u0641\u06cc\u06c1 \u0646\u06d2 \u0627\u0628\u0648 \u06a9\u0627 \u06c1\u0627\u062a\u06be \u067e\u06a9\u0691 \u06a9\u0631 \u06a9\u06c1\u0627\u060c \u201c\u0627\u0628\u0648\u060c \u06a9\u06cc\u0627 \u06c1\u0645 \u0627\u0633\u06d2 \u06af\u06be\u0631 \u0644\u06d2 \u062c\u0627 \u0633\u06a9\u062a\u06d2 \u06c1\u06cc\u06ba\u061f\u201d",
              english:
                "Safiyah held Abu's hand and said, \u201cAbu, can we take it home?\u201d",
            },
            {
              id: "line-8",
              romanUrdu: "Abu muskura diye.",
              urdu: "\u0627\u0628\u0648 \u0645\u0633\u06a9\u0631\u0627 \u062f\u06cc\u06d2\u06d4",
              english: "Abu smiled.",
            },
            {
              id: "line-9",
              romanUrdu:
                "\u201cTheek hai, lekin iska khayal tum bhi rakhogi.\u201d",
              urdu: "\u201c\u0679\u06be\u06cc\u06a9 \u06c1\u06d2\u060c \u0644\u06cc\u06a9\u0646 \u0627\u0633 \u06a9\u0627 \u062e\u06cc\u0627\u0644 \u062a\u0645 \u0628\u06be\u06cc \u0631\u06a9\u06be\u0648 \u06af\u06cc\u06d4\u201d",
              english: "\u201cOkay, but you will also take care of it.\u201d",
            },
            {
              id: "line-10",
              romanUrdu:
                "Safiyah ne foran kaha, \u201cIska naam Chaand hoga!\u201d",
              urdu: "\u0635\u0641\u06cc\u06c1 \u0646\u06d2 \u0641\u0648\u0631\u0627\u064b \u06a9\u06c1\u0627\u060c \u201c\u0627\u0633 \u06a9\u0627 \u0646\u0627\u0645 \u0686\u0627\u0646\u062f \u06c1\u0648\u06af\u0627!\u201d",
              english:
                "Safiyah immediately said, \u201cIts name will be Chaand!\u201d",
            },
            {
              id: "line-11",
              romanUrdu:
                "Ghar aa kar Safiyah ne gattay ki takhti par Chaand ka naam likha.",
              urdu: "\u06af\u06be\u0631 \u0622 \u06a9\u0631 \u0635\u0641\u06cc\u06c1 \u0646\u06d2 \u06af\u062a\u06d2 \u06a9\u06cc \u062a\u062e\u062a\u06cc \u067e\u0631 \u0686\u0627\u0646\u062f \u06a9\u0627 \u0646\u0627\u0645 \u0644\u06a9\u06be\u0627\u06d4",
              english:
                "After coming home, Safiyah wrote Chaand's name on a cardboard sign.",
            },
            {
              id: "line-12",
              romanUrdu:
                "Us ne Chaand ko pani diya, chara khilaya, aur har shaam uske paas baithti.",
              urdu: "\u0627\u0633 \u0646\u06d2 \u0686\u0627\u0646\u062f \u06a9\u0648 \u067e\u0627\u0646\u06cc \u062f\u06cc\u0627\u060c \u0686\u0627\u0631\u06c1 \u06a9\u06be\u0644\u0627\u06cc\u0627\u060c \u0627\u0648\u0631 \u06c1\u0631 \u0634\u0627\u0645 \u0627\u0633 \u06a9\u06d2 \u067e\u0627\u0633 \u0628\u06cc\u0679\u06be\u062a\u06cc\u06d4",
              english:
                "She gave Chaand water, fed him fodder, and sat near him every evening.",
            },
            {
              id: "line-13",
              romanUrdu:
                "Chaand halki si \u201cmee mee\u201d karta, aur uski ghanti \u201cchan chan\u201d bajti.",
              urdu: "\u0686\u0627\u0646\u062f \u06c1\u0644\u06a9\u06cc \u0633\u06cc \u201c\u0645\u06cc\u06ba \u0645\u06cc\u06ba\u201d \u06a9\u0631\u062a\u0627\u060c \u0627\u0648\u0631 \u0627\u0633 \u06a9\u06cc \u06af\u06be\u0646\u0679\u06cc \u201c\u0686\u06be\u0646 \u0686\u06be\u0646\u201d \u0628\u062c\u062a\u06cc\u06d4",
              english:
                "Chaand softly said \u201cmee mee,\u201d and his bell went \u201cchan chan.\u201d",
            },
            {
              id: "line-14",
              romanUrdu:
                "Safiyah kehti, \u201cChaand mera dost hai. Main isay hamesha rakhungi.\u201d",
              urdu: "\u0635\u0641\u06cc\u06c1 \u06a9\u06c1\u062a\u06cc\u060c \u201c\u0686\u0627\u0646\u062f \u0645\u06cc\u0631\u0627 \u062f\u0648\u0633\u062a \u06c1\u06d2\u06d4 \u0645\u06cc\u06ba \u0627\u0633\u06d2 \u06c1\u0645\u06cc\u0634\u06c1 \u0631\u06a9\u06be\u0648\u06ba \u06af\u06cc\u06d4\u201d",
              english:
                "Safiyah would say, \u201cChaand is my friend. I will keep him forever.\u201d",
            },
            {
              id: "line-15",
              romanUrdu:
                "Eid qareeb aayi to Safiyah ne baron ko qurbani ki baat karte suna.",
              urdu: "\u0639\u06cc\u062f \u0642\u0631\u06cc\u0628 \u0622\u0626\u06cc \u062a\u0648 \u0635\u0641\u06cc\u06c1 \u0646\u06d2 \u0628\u0691\u0648\u06ba \u06a9\u0648 \u0642\u0631\u0628\u0627\u0646\u06cc \u06a9\u06cc \u0628\u0627\u062a \u06a9\u0631\u062a\u06d2 \u0633\u0646\u0627\u06d4",
              english:
                "When Eid came near, Safiyah heard the grown-ups talking about qurbani.",
            },
            {
              id: "line-16",
              romanUrdu: "Uski aankhon mein aansu aa gaye.",
              urdu: "\u0627\u0633 \u06a9\u06cc \u0622\u0646\u06a9\u06be\u0648\u06ba \u0645\u06cc\u06ba \u0622\u0646\u0633\u0648 \u0622 \u06af\u0626\u06d2\u06d4",
              english: "Tears came into her eyes.",
            },
            {
              id: "line-17",
              romanUrdu:
                "\u201cLekin Abu, mujhe laga Chaand mera dost hai.\u201d",
              urdu: "\u201c\u0644\u06cc\u06a9\u0646 \u0627\u0628\u0648\u060c \u0645\u062c\u06be\u06d2 \u0644\u06af\u0627 \u0686\u0627\u0646\u062f \u0645\u06cc\u0631\u0627 \u062f\u0648\u0633\u062a \u06c1\u06d2\u06d4\u201d",
              english: "\u201cBut Abu, I thought Chaand was my friend.\u201d",
            },
            {
              id: "line-18",
              romanUrdu: "Ammi uske paas baith gayin.",
              urdu: "\u0627\u0645\u06cc \u0627\u0633 \u06a9\u06d2 \u067e\u0627\u0633 \u0628\u06cc\u0679\u06be \u06af\u0626\u06cc\u06ba\u06d4",
              english: "Ammi sat beside her.",
            },
            {
              id: "line-19",
              romanUrdu:
                "\u201cBeta, dosti ka matlab sirf rakhna nahi hota.\u201d",
              urdu: "\u201c\u0628\u06cc\u0679\u0627\u060c \u062f\u0648\u0633\u062a\u06cc \u06a9\u0627 \u0645\u0637\u0644\u0628 \u0635\u0631\u0641 \u0631\u06a9\u06be\u0646\u0627 \u0646\u06c1\u06cc\u06ba \u06c1\u0648\u062a\u0627\u06d4\u201d",
              english:
                "\u201cMy child, friendship does not only mean keeping something.\u201d",
            },
            {
              id: "line-20",
              romanUrdu:
                "\u201cDosti ka matlab pyar, khayal, aur izzat bhi hota hai.\u201d",
              urdu: "\u201c\u062f\u0648\u0633\u062a\u06cc \u06a9\u0627 \u0645\u0637\u0644\u0628 \u067e\u06cc\u0627\u0631\u060c \u062e\u06cc\u0627\u0644\u060c \u0627\u0648\u0631 \u0639\u0632\u062a \u0628\u06be\u06cc \u06c1\u0648\u062a\u0627 \u06c1\u06d2\u06d4\u201d",
              english:
                "\u201cFriendship also means love, care, and respect.\u201d",
            },
            {
              id: "line-21",
              romanUrdu:
                "Abu ne narmi se kaha, \u201cQurbani zulm nahi hai.\u201d",
              urdu: "\u0627\u0628\u0648 \u0646\u06d2 \u0646\u0631\u0645\u06cc \u0633\u06d2 \u06a9\u06c1\u0627\u060c \u201c\u0642\u0631\u0628\u0627\u0646\u06cc \u0638\u0644\u0645 \u0646\u06c1\u06cc\u06ba \u06c1\u06d2\u06d4\u201d",
              english: "Abu said gently, \u201cQurbani is not cruelty.\u201d",
            },
            {
              id: "line-22",
              romanUrdu:
                "\u201cYeh Allah ka hukum yaad karna, Nabi Ibrahim alayhi-s-salam ki kahani samajhna, aur apni khushi doosron ke saath baantna hai.\u201d",
              urdu: "\u201c\u06cc\u06c1 \u0627\u0644\u0644\u06c1 \u06a9\u0627 \u062d\u06a9\u0645 \u06cc\u0627\u062f \u06a9\u0631\u0646\u0627\u060c \u0646\u0628\u06cc \u0627\u0628\u0631\u0627\u06c1\u06cc\u0645 \u0639\u0644\u06cc\u06c1 \u0627\u0644\u0633\u0644\u0627\u0645 \u06a9\u06cc \u06a9\u06c1\u0627\u0646\u06cc \u0633\u0645\u062c\u06be\u0646\u0627\u060c \u0627\u0648\u0631 \u0627\u067e\u0646\u06cc \u062e\u0648\u0634\u06cc \u062f\u0648\u0633\u0631\u0648\u06ba \u06a9\u06d2 \u0633\u0627\u062a\u06be \u0628\u0627\u0646\u0679\u0646\u0627 \u06c1\u06d2\u06d4\u201d",
              english:
                "\u201cIt is remembering Allah's command, understanding the story of Prophet Ibrahim, peace be upon him, and sharing our happiness with others.\u201d",
            },
            {
              id: "line-23",
              romanUrdu:
                "\u201cBaat se baat banti hai, is liye tum jo poochna chaho pooch sakti ho.\u201d",
              urdu: "\u201c\u0628\u0627\u062a \u0633\u06d2 \u0628\u0627\u062a \u0628\u0646\u062a\u06cc \u06c1\u06d2\u060c \u0627\u0633 \u0644\u06cc\u06d2 \u062a\u0645 \u062c\u0648 \u067e\u0648\u0686\u06be\u0646\u0627 \u0686\u0627\u06c1\u0648 \u067e\u0648\u0686\u06be \u0633\u06a9\u062a\u06cc \u06c1\u0648\u06d4\u201d",
              english:
                "\u201cTalking helps us understand, so you can ask whatever you want to ask.\u201d",
            },
            {
              id: "line-24",
              romanUrdu: "Safiyah ne bohat sawal kiye.",
              urdu: "\u0635\u0641\u06cc\u06c1 \u0646\u06d2 \u0628\u06c1\u062a \u0633\u0648\u0627\u0644 \u06a9\u06cc\u06d2\u06d4",
              english: "Safiyah asked many questions.",
            },
            {
              id: "line-25",
              romanUrdu: "Ammi Abu ne usay pyaar se samjhaya.",
              urdu: "\u0627\u0645\u06cc \u0627\u0628\u0648 \u0646\u06d2 \u0627\u0633\u06d2 \u067e\u06cc\u0627\u0631 \u0633\u06d2 \u0633\u0645\u062c\u06be\u0627\u06cc\u0627\u06d4",
              english: "Ammi and Abu explained it to her with love.",
            },
            {
              id: "line-26",
              romanUrdu:
                "Safiyah ne socha, \u201cJab tak Chaand mere saath hai, main iska sab se acha khayal rakhungi.\u201d",
              urdu: "\u0635\u0641\u06cc\u06c1 \u0646\u06d2 \u0633\u0648\u0686\u0627\u060c \u201c\u062c\u0628 \u062a\u06a9 \u0686\u0627\u0646\u062f \u0645\u06cc\u0631\u06d2 \u0633\u0627\u062a\u06be \u06c1\u06d2\u060c \u0645\u06cc\u06ba \u0627\u0633 \u06a9\u0627 \u0633\u0628 \u0633\u06d2 \u0627\u0686\u06be\u0627 \u062e\u06cc\u0627\u0644 \u0631\u06a9\u06be\u0648\u06ba \u06af\u06cc\u06d4\u201d",
              english:
                "Safiyah thought, \u201cAs long as Chaand is with me, I will take the best care of him.\u201d",
            },
            {
              id: "line-27",
              romanUrdu: "Eid ke din Safiyah ne Eid ke kapray pehne.",
              urdu: "\u0639\u06cc\u062f \u06a9\u06d2 \u062f\u0646 \u0635\u0641\u06cc\u06c1 \u0646\u06d2 \u0639\u06cc\u062f \u06a9\u06d2 \u06a9\u067e\u0691\u06d2 \u067e\u06c1\u0646\u06d2\u06d4",
              english: "On Eid day, Safiyah wore her Eid clothes.",
            },
            {
              id: "line-28",
              romanUrdu:
                "Dil thora udaas tha, lekin jab us ne gosht ke hissay parosiyon aur zarooratmand gharon mein baantay, to logon ke chehray khil uthay.",
