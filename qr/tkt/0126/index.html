  <body>
    <header>

    <h1>Basant Ki Masti</h1>

    <div class="container">
      <div class="book-placeholder"></div>

      <div class="button-container">
        <a href="thekahanitimes.html" class="button">Read Aloud</a>
        <a href="#" id="flashcards-link" class="button">Flashcards</a>
        <a href="#" id="matching-link" class="button">Picture Match</a>
        <a href="#" id="riddles-link" class="button">Riddles</a>
        <a href="#" id="memory-link" class="button">Memory Game</a>
        <a href="#" id="wordsearch-link" class="button">Word Search</a>
      </div>
    </div>
  </body>

  <script>
    // ─── Story vocab ───────────────────────────────────────────────
    // Single source of truth for ALL activities.
    // Edit this list and every game updates automatically.
    window.STORY_WORDS = [
      "subah",
      "jaldi",
      "din",
      "lagbhag",
      "pachees",
      "saalon",
      "baad",
      "shehar",
      "phir",
      "manayi",
      "khirki",
      "bahar",

      "dhoop",

      "hawa",
      "mausam",
      "acha",
      "peela",
      "qameez",
      "khush",
      "khaas",
      "muskurana",
      "pata",
      "patang",
      "urana",
      "chhat",
      "shor",
      "hansna",
      "baatein",
      "rang barangi",
      "kabhi",

      "achanak",
      "kat",
      "ghoomna",
      "neeche",
      "udaas",
      "khamosh",
      "nayi",
      "jeet",
      "haar",
      "khel",
      "hissa",
      "shaam",
      "thand",
      "narangi",
      "gulabi",
      "seekhna",
    ];

    // ─── Build activity URLs from STORY_WORDS ──────────────────────
    const wordParam = encodeURIComponent(window.STORY_WORDS.join(","));
    const base = location.origin + "/qr/assets/html/";

    document.getElementById("flashcards-link").href =
      base + "flashcards.html?words=" + wordParam;
    document.getElementById("matching-link").href =
      base + "matching.html?words=" + wordParam;
    document.getElementById("memory-link").href =
      base + "memory.html?words=" + wordParam;
    document.getElementById("riddles-link").href =
      base + "riddles.html?words=" + wordParam;
    document.getElementById("wordsearch-link").href =
      base + "wordsearch.html?words=" + wordParam;

    // ─── Floating hearts ───────────────────────────────────────────
    const iconSrc = "https://img.icons8.com/color/96/like--v1.png";
    for (let i = 0; i < 15; i++) {
      const icon = document.createElement("img");
      icon.src = iconSrc;
      icon.classList.add("heart");
      icon.style.left = Math.random() * 100 + "vw";
      icon.style.animationDelay = Math.random() * 10 + "s";
      icon.style.width = (16 + Math.random() * 10).toFixed(2) + "px";
      icon.style.animationDuration = (6 + Math.random() * 4).toFixed(2) + "s";
      document.body.appendChild(icon);
    }
  </script>
