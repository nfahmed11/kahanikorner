<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Microsoft Clarity -->
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "tp6dow982y");
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Urdu-English Flashcards</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- App CSS -->
    <link rel="stylesheet" href="/qr/assets/css/qr-base.css" />
    <link rel="stylesheet" href="/qr/assets/css/flashcards.css" />
  </head>

  <body>
    <div class="app-wrapper">
      <!-- Header -->
      <header class="app-header">
        <h1 class="app-title kid-title">Flashcards</h1>

        <div class="header-right">
          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill" style="width: 0%"></div>
            </div>
            <span class="progress-label kid-title" id="progress-text">0/0</span>
          </div>

          <!-- Hamburger -->
          <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Dropdown menu -->
        <div id="menu-dropdown" class="menu-dropdown hidden">
          <button id="toggle-lang" class="menu-item" type="button">
            <svg class="menu-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
            <span class="menu-item-label" id="toggle-lang-label">English → Urdu</span>
          </button>

          <button id="toggle-image" class="menu-item" type="button">
            <svg class="menu-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span class="menu-item-label" id="toggle-image-label">Show Image</span>
          </button>

          <div class="menu-divider"></div>

          <a id="quiz-link" class="menu-item" href="#">
            <svg class="menu-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
            <span class="menu-item-label">Quiz Mode</span>
          </a>
        </div>
      </header>

      <!-- Card Area -->
      <main class="card-area">
        <div class="flashcard-container">
          <div class="flashcard" id="flashcard">
            <div class="flashcard-front" id="flashcard-front"></div>
            <div class="flashcard-back" id="flashcard-back"></div>
          </div>
        </div>

        <!-- Nav arrows -->
        <div class="nav-arrows" id="nav-buttons">
          <button id="prev-btn" class="arrow-btn" type="button" aria-label="Previous card">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <button id="next-btn" class="arrow-btn" type="button" aria-label="Next card">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
          </button>
        </div>
      </main>
    </div>

    <script>
      // Read ALLOWED_WORDS from the ?words= query param
      (function () {
        const params = new URLSearchParams(location.search);
        const raw = params.get("words");
        if (!raw) {
          console.warn("[flashcards] No ?words= param found in URL. Deck will be empty.");
          window.ALLOWED_WORDS = new Set();
          return;
        }
        window.ALLOWED_WORDS = new Set(
          raw.split(",").map((w) => w.trim()).filter(Boolean)
        );

        // Set quiz link href to pass words along
        const quizLink = document.getElementById("quiz-link");
        if (quizLink) {
          quizLink.href = `/qr/assets/html/quiz.html?words=${raw}`;
        }
      })();
    </script>

    <!-- App JS (module) -->
    <script type="module" src="/qr/assets/js/flashcards.js"></script>
  </body>
</html>
