<!DOCTYPE html>
<html lang="en">
  <head>

        y = l.getElementsByTagName(r)[0];

    <!-- Google tag -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-N97Z02BGG4"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riddle Game</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap"
      rel="stylesheet" />

    <link rel="stylesheet" href="/qr/assets/css/riddles.css" />
  </head>

  <body>
    <!-- Floating candy decorations -->
    <div class="candy-float candy-float--1" aria-hidden="true">
      <svg viewBox="0 0 120 80" class="candy-svg candy-svg--wrapped">
        <g>
          <path d="M20 40 L4 24 L4 56 Z" fill="#92c9ff"></path>
          <path d="M100 40 L116 24 L116 56 Z" fill="#f5a2bb"></path>
          <rect x="20" y="18" width="80" height="44" rx="22" fill="#fff0f8" stroke="#f5a2bb" stroke-width="4"></rect>
          <circle cx="45" cy="40" r="6" fill="#ffe38b"></circle>
          <circle cx="60" cy="40" r="6" fill="#92c9ff"></circle>
          <circle cx="75" cy="40" r="6" fill="#90dfb1"></circle>
        </g>
      </svg>
    </div>

    <div class="candy-float candy-float--2" aria-hidden="true">
      <svg viewBox="0 0 90 90" class="candy-svg candy-svg--lollipop">
        <g>
          <path d="M44 52 L54 84" stroke="#d9b38c" stroke-width="5" stroke-linecap="round"></path>
          <circle cx="40" cy="36" r="22" fill="#ebe3ff" stroke="#b9a7f5" stroke-width="4"></circle>
          <path d="M25 28 C36 18, 53 18, 56 34 C58 45, 49 55, 38 55 C28 55, 19 47, 20 36" fill="none" stroke="#fff7ef" stroke-width="4" stroke-linecap="round"></path>
        </g>
      </svg>
    </div>

    <div class="candy-float candy-float--3" aria-hidden="true">
      <svg viewBox="0 0 110 76" class="candy-svg candy-svg--gumdrop">
        <g>
          <path d="M18 58 C18 32, 38 14, 56 14 C74 14, 94 32, 94 58 Z" fill="#d6f4df" stroke="#90dfb1" stroke-width="4"></path>
          <circle cx="43" cy="37" r="5" fill="#ffffff" opacity=".55"></circle>
        </g>
      </svg>
    </div>

    <div class="candy-float candy-float--4" aria-hidden="true">
      <svg viewBox="0 0 120 84" class="candy-svg candy-svg--wrapped">
        <g>
          <path d="M20 42 L4 28 L4 56 Z" fill="#ffe38b"></path>
          <path d="M100 42 L116 28 L116 56 Z" fill="#92c9ff"></path>
          <rect x="20" y="20" width="80" height="44" rx="22" fill="#eef7ff" stroke="#92c9ff" stroke-width="4"></rect>
          <path d="M35 30 L85 54" stroke="#ffffff" stroke-width="4" opacity=".65"></path>
          <path d="M35 54 L85 30" stroke="#ffffff" stroke-width="4" opacity=".45"></path>
        </g>
      </svg>
    </div>

    <header class="header">
      <div class="header-left">
        <span class="streak-badge" id="streak-badge" aria-live="polite"></span>
      </div>

      <div class="header-right">
        <button
          class="settings-btn"
          id="settings-toggle"
          type="button"
          aria-haspopup="dialog"
          aria-expanded="false">
          <span class="settings-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></span>
          <span class="settings-label">Settings</span>
          <span class="arrow" id="settings-arrow">▾</span>
        </button>
      </div>

      <div class="settings-dropdown" id="settings-dropdown" aria-hidden="true">
        <div class="difficulty-section">
          <div class="difficulty-slider">
            <div class="difficulty-toprow">
              <span class="difficulty-title">Difficulty</span>
              <span id="difficulty-label" class="difficulty-badge">Hard</span>
            </div>

            <input
              id="difficulty-range"
              type="range"
              min="0"
              max="2"
              step="1"
              value="2"
              aria-label="Difficulty" />

            <div class="difficulty-legend">
              <span>Easy</span>
              <span>Medium</span>
              <span>Hard</span>
            </div>
          </div>
        </div>

        <div class="language-section">
          <div class="section-label">Riddle language</div>

          <label class="language-option">
            <input type="checkbox" id="romanUrdu" checked />
            <span>Roman Urdu</span>
          </label>

          <label class="language-option">
            <input type="checkbox" id="urdu" checked />
            <span>اردو</span>
          </label>

          <label class="language-option">
            <input type="checkbox" id="english" checked />
            <span>English</span>
          </label>
        </div>
      </div>
    </header>

    <div
      class="settings-modal hidden"
      id="settings-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-modal-title">
      <div class="settings-modal-backdrop" id="settings-modal-backdrop"></div>

      <div class="settings-modal-card" role="document">
        <div class="settings-modal-header">
          <h2 id="settings-modal-title">Settings</h2>
          <button
            class="settings-close"
            id="settings-modal-close"
            type="button"
            aria-label="Close settings">
            ✕
          </button>
        </div>

        <div class="settings-modal-body" id="settings-modal-body"></div>

        <div class="settings-modal-footer">
          <button class="settings-done" id="settings-modal-done" type="button">
            Done
          </button>
        </div>
      </div>
    </div>

    <main class="container">
      <section class="game-area">
        <div class="game-title-wrap">
          <div class="title-cloud" aria-hidden="true">
            <span class="title-cloud__spark title-cloud__spark--left">🍬</span>
            <span class="title-cloud__moon">☾</span>
            <h1 id="header-title" class="game-title">Main Kaun Hoon?</h1>
            <span class="title-cloud__spark title-cloud__spark--right">🍭</span>
          </div>
        </div>

        <div class="riddle-container" id="riddle-container"></div>

        <div
          class="status-card"
          id="status"
          role="status"
          aria-live="polite">
          <p class="status-card__text" id="status-instruction"></p>
        </div>

        <div class="answer-area" id="answer-area"></div>

        <div class="word-options" id="word-options"></div>
      </section>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const raw = params.get("words");

        if (!raw) {
          console.warn("[riddles] No ?words= param found in URL. Deck will be empty.");
          window.ALLOWED_WORDS = new Set();
          return;
        }

        window.ALLOWED_WORDS = new Set(
          raw.split(",").map((w) => w.trim()).filter(Boolean)
        );
      })();
    </script>

    <script type="module" src="/qr/assets/js/riddles.js"></script>
  </body>
</html>
