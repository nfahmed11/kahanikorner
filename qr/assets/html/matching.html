<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Microsoft Analytics tag to track analytics  -->
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "tp6dow982y");
    </script>

    <!-- Google tag to track analytics (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-N97Z02BGG4"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-N97Z02BGG4");
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matching Game</title>

    <link rel="stylesheet" href="/qr/assets/css/matching.css" />
  </head>

  <body>
    <div class="top-bar">
      <div class="title">
        <div class="roman">TASVEER SE PEHCHAAN</div>
        <div class="urdu">تصویر سے پہچان</div>
        <div class="english">Guess the Picture</div>
      </div>

      <div class="timer-container">
        <div class="timer-toggle-wrapper">
          <span id="timer-status-label">Timer OFF</span>
          <label class="switch">
            <input type="checkbox" id="timer-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="game-status hidden" id="game-status">
          <div id="timer">Time: 60s</div>
          <div id="score">Score: 0</div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="game-area">
        <div class="image-container">
          <img
            id="target-image"
            src=""
            alt="Target Image"
            class="target-image" />
        </div>

        <div class="drop-zone" id="drop-zone">Select An Answer</div>

        <div class="word-options" id="word-options">
          <!-- Words will be inserted dynamically -->
        </div>
      </div>
    </div>

    <!-- Custom Game Over Modal -->
    <div id="game-over-modal" class="modal hidden">
      <div class="modal-content">
        <h2>⏰ Time's Up!</h2>
        <p>Your final score is: <span id="final-score">0</span></p>
        <button id="restart-button">Play Again!</button>
      </div>
    </div>

    <script>
      // Read ALLOWED_WORDS from the ?words= query param set by the story's index.html
      (function () {
        const params = new URLSearchParams(location.search);
        const raw = params.get("words");
        if (!raw) {
          console.warn(
            "[matching] No ?words= param found in URL. Deck will be empty."
          );
          window.ALLOWED_WORDS = new Set();
          return;
        }
        window.ALLOWED_WORDS = new Set(
          raw
            .split(",")
            .map((w) => w.trim())
            .filter(Boolean)
        );
        console.log("[matching] ALLOWED_WORDS loaded from URL:", [
          ...window.ALLOWED_WORDS,
        ]);
      })();
    </script>

    <script type="module" src="/qr/assets/js/matching.js"></script>
  </body>
</html>
