<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Microsoft Clarity -->
    <script type="text/javascript">
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "tp6dow982y");
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Picture Match</title>

    <link rel="stylesheet" href="/qr/assets/css/matching.css" />
  </head>

  <body>
    <!-- Header bar -->
    <header class="header">
      <h1 class="header-title">Picture Match</h1>
      <div class="header-stats">
        <div class="stat-pill stat-pill--progress">
          <span id="progress-text">0/0</span>
        </div>
        <div class="stat-pill stat-pill--streak" id="streak-pill">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span id="streak-text">0</span>
        </div>
      </div>
    </header>

    <!-- Game area -->
    <main class="game">
      <!-- Image card -->
      <div class="image-card" id="image-card">
        <img id="target-image" src="" alt="Guess this word" class="image-card-img" />
      </div>

      <!-- Feedback overlay (shows on answer) -->
      <div class="feedback" id="feedback"></div>

      <!-- Answer buttons -->
      <div class="answers" id="answers"></div>
    </main>

    <!-- Game complete modal -->
    <div class="modal-backdrop hidden" id="complete-modal">
      <div class="modal-card">
        <div class="modal-emoji" id="modal-emoji">🎉</div>
        <h2 class="modal-title" id="modal-title">Nice work!</h2>
        <p class="modal-stat" id="modal-stat"></p>
        <div class="modal-actions">
          <button class="modal-btn modal-btn--primary" id="play-again-btn">Play Again</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const raw = params.get("words");
        if (!raw) {
          window.ALLOWED_WORDS = new Set();
          return;
        }
        window.ALLOWED_WORDS = new Set(
          raw.split(",").map((w) => w.trim()).filter(Boolean)
        );
      })();
    </script>

    <script type="module" src="/qr/assets/js/matching.js"></script>
  </body>
</html>
