# Optimized image variants, generated by tools/optimize-images.sh into
# assets/images/opt/ with a content hash in each filename.
#
# Format:  name | source (relative to assets/images) | widths | encoder args
#   widths: space-separated pixel widths; "full" = the source's own width.
#           Widths larger than the source are refused (no upscaling).
#   encoder args: cwebp options for .webp output, or "png" for a resized PNG
#           (used for favicons, which need broad browser support).
#
# After editing this file or replacing a source image, run the script and
# update the matching srcset/href in the HTML with the new filenames it prints.

fam          | homepage/fam.png                     | full               | -q 82 -m 6 -sharp_yuv -mt
fourbundle   | products/books/bundle/fourbundle.png | 400 600 800 full   | -q 85 -m 6 -sharp_yuv -mt
jan          | products/subscribe/jan.png           | 400 600 800 full   | -q 85 -alpha_q 100 -m 6 -sharp_yuv -mt
stickers-all | products/stickers/all/all.png        | 400 full           | -q 88 -m 6 -sharp_yuv -mt
contact      | homepage/contact.png                 | 640 960 full       | -q 85 -m 6 -sharp_yuv -mt
logo         | homepage/logo.png                    | 120 240 360        | -q 90 -alpha_q 100 -m 6 -sharp_yuv -mt
logo2        | homepage/logo2.png                   | 40 80 120          | -q 90 -alpha_q 100 -m 6 -sharp_yuv -mt
favicon      | homepage/logo2.png                   | 48 180             | png
