      referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="../quicklinks/SharedCSS/common.css" />
    <link rel="stylesheet" href="/assets/css/navbar.css" />

    <style>
      /* ── THEME VARIABLES ── */
      :root {
        --granite: #4a594a;
        --deep-teal: #687d70;
        --ash-grey: #b0c3b7;
        --white-smoke: #f3f1f0;
        --soft-blush: #f3dedd;
        --cotton-rose: #ffc4c3;
        --rosy-taupe: #d49797;
        --black: #1c2524;
        --white: #ffffff;
        --mint: #c9dcce;
        --radius-lg: 24px;
        --radius-pill: 999px;
        --shadow-soft: 0 18px 40px rgba(74, 89, 74, 0.15);
        --shadow-hover: 0 22px 50px rgba(74, 89, 74, 0.25);
        --card-bg: #ffffff;
        --danger: #ef4444;
        --muted: #5c6b68;
        --topbar-h: 15px;
        --header-top-gap: 1.75rem;
        --header-h: 74px;
      }

      /* ── RESET & BASE ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        overflow-x: hidden;
      }
      img {
        max-width: 100%;
        display: block;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      select {
        font-family: inherit;
        cursor: pointer;
      }

      body {
        margin: 0;
        font-family: "Open Sans", system-ui, sans-serif;
        color: var(--granite);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        background: var(--white-smoke);
        opacity: 1 !important;
        visibility: visible !important;
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: "Grandstander", cursive;
        font-weight: 800;
        line-height: 1.2;
        margin: 0 0 1rem;
        color: var(--granite);
      }

      .hidden {
        display: none !important;
      }

      /* ── TOP PROMO BAR ── */
      .topbar {
        width: 100%;
        background: var(--ash-grey);
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        white-space: nowrap;
      }

      .topbar__inner {
        display: flex;
        align-items: center;
        width: 100%;
      }

      .topbar__track {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 22s linear infinite;
      }

      .topbar__track span {
        display: inline-block;
        padding-right: 50px;
        opacity: 0.95;
      }

      @keyframes marquee {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      /* ── HEADER ── */
      .header {
        position: fixed;
        top: calc(var(--topbar-h) + var(--header-top-gap));
        left: 50%;
        transform: translateX(-50%);
        width: min(1200px, calc(100% - 2rem));
        z-index: 100;
        padding: 0.5rem 2rem;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(176, 195, 183, 0.7);
        border-radius: 999px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        transition:
          background 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease;
      }

      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
      }

      .header-spacer {
        height: calc(
          var(--topbar-h) + var(--header-top-gap) + var(--header-h) + 1rem
        );
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Grandstander", cursive;
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--granite);
      }

      .brand-logo {
        height: 32px;
        width: auto;
        display: block;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 40px;
        font-weight: 300;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .nav a {
        color: var(--granite);
        transition:
          color 0.2s,
          font-weight 0.1s;
      }

      .nav a:hover {
        color: var(--soft-blush);
        font-weight: 700;
        text-shadow:
          -1px -1px 0 var(--granite),
          1px -1px 0 var(--granite),
          -1px 1px 0 var(--granite),
          1px 1px 0 var(--granite);
      }

      .nav a.nav-active {
        font-weight: 700;
        color: var(--rosy-taupe);
      }

      .mobile-toggle {
        display: none;
        background: none;
        border: none;
        font-size: 1.5rem;
        color: var(--granite);
        padding: 0.25rem;
        -webkit-tap-highlight-color: transparent;
      }

      .header-actions {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .icon-btn-circle {
        background: var(--mint);
        border: 1px solid var(--granite);
        width: 2.35rem;
        height: 2.35rem;
        border-radius: 50%;
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--granite);
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          background 0.2s;
        cursor: pointer;
        font-size: 1rem;
        -webkit-tap-highlight-color: transparent;
      }

      .icon-btn-circle:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 0 var(--granite);
        background: var(--ash-grey);
      }

      .cart-badge-landing {
        position: absolute;
        top: -0.25rem;
        right: -0.25rem;
        background: var(--rosy-taupe);
        color: white;
        font-size: 0.75rem;
        font-weight: 800;
        min-width: 1.5rem;
        height: 1.5rem;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--white-smoke);
      }

      /* Chai tooltip */
      .chai-btn {
        position: relative;
        isolation: isolate;
      }

      .chai-btn::before,
      .chai-btn::after {
        content: "";
        position: absolute;
        top: 6px;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        border: 2px solid rgba(212, 151, 151, 0.7);
        opacity: 0;
        transform: translateY(0) scale(0.9);
        pointer-events: none;
      }

      .chai-btn::before {
        left: 11px;
      }
      .chai-btn::after {
        right: 11px;
      }

      .chai-btn:hover::before {
        animation: steamUp 1.1s ease-in-out infinite;
      }
      .chai-btn:hover::after {
        animation: steamUp 1.1s 0.15s ease-in-out infinite;
      }

      @keyframes steamUp {
        0% {
          opacity: 0;
          transform: translateY(6px) scale(0.8);
        }
        30% {
          opacity: 0.55;
        }
        70% {
          opacity: 0.2;
        }
        100% {
          opacity: 0;
          transform: translateY(-10px) scale(1.15);
        }
      }

      .chai-tooltip {
        position: absolute;
        right: 0;
        top: 130%;
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid rgba(176, 195, 183, 0.8);
        color: var(--granite);
        padding: 0.55rem 0.7rem;
        border-radius: 14px;
        box-shadow: 0 14px 30px rgba(74, 89, 74, 0.18);
        font-weight: 800;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        transform: translateY(-6px);
        pointer-events: none;
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }

      .chai-tooltip::after {
        content: "";
        position: absolute;
        right: 16px;
        top: -8px;
        width: 14px;
        height: 14px;
        background: rgba(255, 255, 255, 0.95);
        border-left: 2px solid rgba(176, 195, 183, 0.8);
        border-top: 2px solid rgba(176, 195, 183, 0.8);
        transform: rotate(45deg);
      }

      .chai-btn:hover .chai-tooltip,
      .chai-btn:focus-visible .chai-tooltip {
        opacity: 1;
        transform: translateY(0);
      }

      /* ── MOBILE MENU ── */
      .mobile-menu-overlay {
        position: fixed;
        inset: 0;
        background: rgba(28, 37, 36, 0.35);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 120;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .mobile-menu-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .mobile-menu {
        position: absolute;
        top: 0;
        right: 0;
        width: 80%;
        max-width: 320px;
        height: 100%;
        background: var(--white);
        border-left: 2px solid var(--ash-grey);
        box-shadow: -4px 0 30px rgba(0, 0, 0, 0.18);
        border-radius: 24px 0 0 24px;
        padding: 1.75rem 1.5rem 2rem;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      .mobile-menu-overlay.open .mobile-menu {
        transform: translateX(0);
      }

      .mobile-menu__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.25rem;
      }

      .mobile-menu__brand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: "Grandstander", cursive;
        font-weight: 800;
        color: var(--granite);
      }

      .mobile-menu__close {
        background: var(--soft-blush);
        border: 2px solid var(--granite);
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        color: var(--granite);
        cursor: pointer;
      }

      .mobile-menu__links {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .mobile-menu__links li a {
        display: block;
        padding: 0.75rem 0.25rem;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 600;
        color: var(--granite);
        border-bottom: 1px dashed var(--white-smoke);
      }

      .mobile-menu__links li a.nav-active {
        color: var(--rosy-taupe);
      }

      @media (min-width: 769px) {
        .mobile-menu-overlay {
          display: none;
        }
      }

      @media (max-width: 768px) {
        .header {
          padding: 0.5rem 1rem;
        }

        .header__inner {
          display: grid !important;
          grid-template-columns: 1fr auto 1fr;
          align-items: center;
          width: 100%;
        }

        .mobile-toggle {
          display: block !important;
          grid-column: 1;
          justify-self: start;
        }
        .brand {
          grid-column: 2;
          justify-self: center;
        }
        .header-actions {
          grid-column: 3;
          justify-self: end;
        }
        .nav {
          display: none !important;
        }
      }

      /* ── CART OVERLAY ── */
      .cart-overlay {
        position: fixed;
        inset: 0;
        background: rgba(74, 89, 74, 0.2);
        z-index: 110;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        backdrop-filter: blur(4px);
      }

      .cart-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .cart-sidebar {
        position: absolute;
        top: 1rem;
        right: 1rem;
        bottom: 1rem;
        width: calc(100% - 2rem);
        max-width: 400px;
        background: var(--card-bg);
        border-radius: 1.5rem;
        box-shadow: 0 0 0 4px var(--ash-grey);
        transform: translateX(110%);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .cart-overlay.open .cart-sidebar {
        transform: translateX(0);
      }

      .cart-header {
        padding: 1.5rem;
        border-bottom: 2px dashed var(--ash-grey);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--white-smoke);
      }

      .cart-header h2 {
        margin: 0;
        font-size: 1.25rem;
      }

      .close-btn {
        background: var(--soft-blush);
        border: none;
        font-size: 1.25rem;
        color: var(--granite);
        padding: 0.5rem;
        border-radius: 50%;
        width: 2.5rem;
        height: 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        cursor: pointer;
      }

      .cart-items {
        flex: 1;
        overflow-y: auto;
        padding: 1.5rem;
      }

      .cart-item {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        background: var(--white-smoke);
        padding: 1rem;
        border-radius: 1rem;
      }

      .cart-item img {
        width: 4rem;
        height: 4rem;
        border-radius: 0.75rem;
        object-fit: cover;
      }
      .cart-item-details {
        flex: 1;
      }
      .cart-item-details h4 {
        font-size: 1rem;
        margin-bottom: 0.25rem;
      }
      .cart-item-price {
        font-weight: 700;
        color: var(--rosy-taupe);
        margin-bottom: 0.5rem;
      }
      .cart-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .qty-btn {
        background: var(--white-smoke);
        border: 1px solid var(--ash-grey);
        border-radius: 6px;
        width: 1.75rem;
        height: 1.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .remove-btn {
        background: none;
        border: none;
        color: var(--danger);
        font-size: 0.8rem;
        cursor: pointer;
        padding: 0;
        margin-left: auto;
      }

      .empty-cart-msg {
        text-align: center;
        color: var(--muted);
        padding: 2rem;
      }

      .cart-footer {
        padding: 1.5rem;
        border-top: 2px dashed var(--ash-grey);
        background: var(--white-smoke);
      }

      .cart-total {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        margin-bottom: 1rem;
      }

      .checkout-btn {
        width: 100%;
        padding: 0.85rem;
        background: var(--granite);
        color: white;
        border: none;
        border-radius: var(--radius-pill);
        font-family: "Grandstander", cursive;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
      }

      .checkout-btn:hover {
        background: var(--deep-teal);
      }

      /* ── PAGE LAYOUT ── */
      .page-main {
        width: min(1200px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 3.25rem 0 4rem;
      }

      .cartoons-card {
        background: var(--card-bg);
        border: 1px solid var(--ash-grey);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
        padding: clamp(1.75rem, 3vw, 3rem) clamp(1.25rem, 3vw, 2.5rem);
        overflow: hidden;
      }

      /* ── PAGE HEADER ── */
      .cartoons-header {
        text-align: center;
        margin-bottom: 0;
      }

      .cartoons-header h1 {
        font-size: clamp(2rem, 3.2vw, 2.6rem);
        margin-bottom: 0.75rem;
      }

      .subheading {
        margin: 0 auto 0;
        max-width: 760px;
        color: var(--muted);
        font-size: clamp(0.95rem, 1.2vw, 1.05rem);
        line-height: 1.75;
      }

      /* ── STICKY CONTROLS ── */
      .controls-sticky {
        position: sticky;
        top: calc(
          var(--topbar-h) + var(--header-top-gap) + var(--header-h) + 0.5rem
        );
        z-index: 50;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 1rem 0;
        margin: 1.75rem 0 0;
        border-bottom: 1.5px solid rgba(176, 195, 183, 0.45);
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }

      .search-wrap {
        position: relative;
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
      }

      .search-wrap i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--deep-teal);
        font-size: 0.9rem;
        pointer-events: none;
      }

      #searchInput {
        width: 100%;
        box-sizing: border-box;
        padding: 0.6rem 1rem 0.6rem 2.5rem;
        font-size: 0.88rem;
        font-family: inherit;
        font-weight: 500;
        border-radius: 999px;
        border: 2px solid var(--ash-grey);
        background: var(--white-smoke);
        color: var(--granite);
        transition:
          box-shadow 0.2s ease,
          border-color 0.2s ease;
        outline: none;
      }

      #searchInput:focus {
        border-color: var(--deep-teal);
        box-shadow: 0 0 0 3px rgba(104, 125, 112, 0.12);
      }

      #searchInput::placeholder {
        color: var(--ash-grey);
      }

      .filter-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .filter-label-inline {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--deep-teal);
        white-space: nowrap;
      }

      /* ── LANGUAGE PILLS ── */
      .lang-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
      }

      .lang-pill {
        border-radius: 999px;
        padding: 0.35rem 0.9rem;
        font-size: 0.8rem;
        font-weight: 600;
        font-family: inherit;
        border: 2px solid var(--deep-teal);
        background: var(--white-smoke);
        color: var(--granite);
        cursor: pointer;
        line-height: 1;
        white-space: nowrap;
        transition:
          background 0.2s ease,
          color 0.2s ease,
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .lang-pill:hover {
        background: var(--ash-grey);
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(74, 89, 74, 0.15);
      }

      .lang-pill[aria-selected="true"] {
        background: var(--deep-teal);
        color: #fff;
        border-color: var(--deep-teal);
        box-shadow: 0 4px 12px rgba(74, 89, 74, 0.25);
      }

      .lang-pill[aria-selected="true"]:hover {
        background: var(--granite);
        border-color: var(--granite);
        transform: translateY(-1px);
      }

      .lang-pill:focus-visible {
        outline: 2px solid var(--granite);
        outline-offset: 3px;
      }

      /* ── RESULTS COUNT ── */
      .results-meta {
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
        padding: 1.25rem 0 0;
        letter-spacing: 0.04em;
      }

      /* ── CHANNEL GRID ── */
      .channel-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.25rem;
        margin-top: 1.5rem;
      }

      @media (max-width: 1100px) {
        .channel-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 768px) {
        .channel-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 1rem;
        }
      }
      @media (max-width: 440px) {
        .channel-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── CHANNEL CARD ── */
      .channel-card {
        background: var(--white);
        border: 1.5px solid rgba(176, 195, 183, 0.5);
        border-radius: 18px;
        box-shadow: 0 6px 20px rgba(74, 89, 74, 0.09);
        display: flex;
        flex-direction: column;
        align-items: center;

        font-weight: 700;

        margin-top: 0.35rem;

      // ── Card builder ──────────────────────────────────────────────────────────

      function buildCard(channel, colorIndex) {
        const palettes =
          channel.language === "urdu" ? URDU_PALETTES : HINDI_PALETTES;
        const palette = palettes[colorIndex % palettes.length];
        const initial = channel.name.charAt(0).toUpperCase();

        const card = document.createElement("article");
        card.className = "channel-card";
        card.dataset.lang = channel.language;
        card.dataset.name = channel.name.toLowerCase();
        card.dataset.desc = channel.description.toLowerCase();

        // Avatar
        const avatarWrap = document.createElement("div");
        avatarWrap.className = "channel-avatar";
        avatarWrap.style.background = palette.bg;

        const fallback = document.createElement("span");
        fallback.className = "avatar-fallback";
        fallback.textContent = initial;
        fallback.style.color = palette.text;
        fallback.setAttribute("aria-hidden", "true");
        avatarWrap.appendChild(fallback);

        if (channel.profileImageUrl) {
          const avatarImg = document.createElement("img");
          avatarImg.className = "channel-avatar-img";
          avatarImg.src = channel.profileImageUrl;
          avatarImg.alt = `${channel.name} profile image`;
          avatarImg.loading = "lazy";
          avatarImg.referrerPolicy = "no-referrer";
          avatarImg.onerror = () => avatarImg.remove();
          avatarWrap.appendChild(avatarImg);
        }

        // Name
        const nameEl = document.createElement("h2");
        nameEl.className = "channel-name";
        nameEl.textContent = channel.name;

        // Badge
        const badge = document.createElement("span");
        badge.className = `lang-badge ${channel.language}`;
        badge.textContent = channel.language === "urdu" ? "Urdu" : "Hindi";

        // Description
        const desc = document.createElement("p");
        desc.className = "channel-desc";
        desc.textContent = channel.description;

        // Buttons
        const actions = document.createElement("div");
        actions.className = "card-actions";

        const visitBtn = document.createElement("a");
        visitBtn.className = "btn-visit";
        visitBtn.href = channel.allVideosUrl;
        visitBtn.target = "_blank";
        visitBtn.rel = "noopener noreferrer";
        visitBtn.setAttribute("aria-label", `View videos from ${channel.name}`);
        visitBtn.innerHTML =
          '<i class="fa-brands fa-youtube" aria-hidden="true" style="margin-right:0.4rem;"></i>View Videos';

        const homeBtn = document.createElement("a");
        homeBtn.className = "btn-home";
        homeBtn.href = channel.playlistsUrl;
        homeBtn.target = "_blank";
        homeBtn.rel = "noopener noreferrer";
        homeBtn.setAttribute(
          "aria-label",
          `View ${channel.name} playlists`,
        );
        homeBtn.innerHTML =
          '<i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true" style="margin-right:0.35rem; font-size:0.7rem;"></i>Playlists';

        actions.appendChild(visitBtn);
        actions.appendChild(homeBtn);

        card.appendChild(avatarWrap);
        card.appendChild(nameEl);
        card.appendChild(badge);
        card.appendChild(desc);
        card.appendChild(actions);

        return card;
      }

      // ── Render & filter ───────────────────────────────────────────────────────

      const grid = document.getElementById("channelGrid");
      const noResults = document.getElementById("noResults");
      const resultsCount = document.getElementById("resultsCount");

      function getActiveLang() {
        return (
          document.querySelector('.lang-pill[aria-selected="true"]')?.dataset
            .lang ?? "all"
        );
      }

      function getSearchTerm() {
        return document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();
      }

      function renderChannels() {
        const lang = getActiveLang();
        const term = getSearchTerm();

        const filtered = channels.filter((ch) => {
          const langMatch = lang === "all" || ch.language === lang;
          const searchMatch =
            !term ||
            ch.name.toLowerCase().includes(term) ||
            ch.description.toLowerCase().includes(term) ||
            ch.language.includes(term);
          return langMatch && searchMatch;
        });

        grid.innerHTML = "";

        if (filtered.length === 0) {
          noResults.classList.remove("hidden");
          resultsCount.textContent = "";
        } else {
          noResults.classList.add("hidden");
          filtered.forEach((ch, i) => grid.appendChild(buildCard(ch, i)));
          resultsCount.textContent =
            filtered.length === channels.length
              ? `Showing all ${channels.length} channels`
              : `Showing ${filtered.length} of ${channels.length} channels`;
        }
      }

      // ── URL param support ────────────────────────────────────────────────────

      function applyURLParams() {
        const params = new URLSearchParams(window.location.search);
        const langParam = params.get("lang")?.toLowerCase();
        const qParam = params.get("q");

        if (langParam && ["urdu", "hindi", "all"].includes(langParam)) {
          document.querySelectorAll(".lang-pill").forEach((p) => {
            const selected = p.dataset.lang === langParam;
            p.setAttribute("aria-selected", String(selected));
            p.tabIndex = selected ? 0 : -1;
          });
        }
        if (qParam) document.getElementById("searchInput").value = qParam;
      }

      // ── Language pill interaction ─────────────────────────────────────────────

      function setupLangPills() {
        const pills = document.querySelectorAll(".lang-pill");
        pills.forEach((pill) => {
          pill.addEventListener("click", () => {
            pills.forEach((p) => {
              p.setAttribute("aria-selected", "false");
              p.tabIndex = -1;
            });
            pill.setAttribute("aria-selected", "true");
            pill.tabIndex = 0;
            renderChannels();
          });

          pill.addEventListener("keydown", (e) => {
            const arr = Array.from(pills);
            const idx = arr.indexOf(pill);
            if (e.key === "ArrowRight" || e.key === "ArrowDown") {
              e.preventDefault();
              arr[(idx + 1) % arr.length].focus();
            } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
              e.preventDefault();
              arr[(idx - 1 + arr.length) % arr.length].focus();
            }
          });
        });
      }

      document.getElementById("searchInput").addEventListener("input", () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(renderChannels, 120);
      });

        localStorage.setItem("kahani_cart", JSON.stringify(cart));
      }

      function updateCartUI() {
        const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
        if (cartBadge) {
          cartBadge.textContent = totalItems;
          cartBadge.classList.toggle("hidden", totalItems === 0);
        }
        const total = cart.reduce(
          (sum, item) => sum + item.price * item.quantity,
          0,
        );
        if (cartTotalAmount)
          cartTotalAmount.textContent = `$${total.toFixed(2)}`;
        if (!cartItemsContainer) return;
        if (cart.length === 0) {
          cartItemsContainer.innerHTML =
            '<div class="empty-cart-msg">Your cart is empty.</div>';
        } else {
          cartItemsContainer.innerHTML = cart
            .map(
              (item) => `
            <div class="cart-item">
              <img src="${item.image}" alt="${item.name}">
              <div class="cart-item-details">
                <h4>${item.name}</h4>
                <div class="cart-item-price">$${(item.price * item.quantity).toFixed(2)}</div>
                <div class="cart-controls">
                  <button class="qty-btn" onclick="updateQuantity('${item.id}', -1)">-</button>
                  <span>${item.quantity}</span>
                  <button class="qty-btn" onclick="updateQuantity('${item.id}', 1)">+</button>
                  <button class="remove-btn" onclick="removeFromCart('${item.id}')">Remove</button>
                </div>
              </div>
            </div>
          `,
            )
            .join("");
        }
      }

      window.updateQuantity = (productId, change) => {
        const item = cart.find((item) => item.id === productId);
        if (!item) return;
        item.quantity += change;
        if (item.quantity <= 0) window.removeFromCart(productId);
        else {
          saveCart();
          updateCartUI();
        }
      };

      window.removeFromCart = (productId) => {
        cart = cart.filter((item) => item.id !== productId);
        saveCart();
        updateCartUI();
      };

      function openCart() {
        if (!cartOverlay) return;
        cartOverlay.classList.remove("hidden");
        setTimeout(() => cartOverlay.classList.add("open"), 10);
      }

      function closeCart() {
        if (!cartOverlay) return;
        cartOverlay.classList.remove("open");
        setTimeout(() => cartOverlay.classList.add("hidden"), 300);
      }

      async function handleCheckout() {
        if (!checkoutBtn || cart.length === 0) return;
        const { line_items } = buildStripePayload(cart);
        const originalText = checkoutBtn.innerText;
        checkoutBtn.innerText = "Redirecting to Stripe…";
        checkoutBtn.disabled = true;
        try {
          const response = await fetch("/create-checkout-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items: line_items }),
          });
          if (!response.ok) {
            alert("There was a problem starting checkout. Please try again.");
            checkoutBtn.innerText = originalText;
            checkoutBtn.disabled = false;
            return;
          }
          const data = await response.json();
          window.location.href = data.url;
        } catch (err) {
          console.error("Error:", err);
          alert("Unexpected error. Please try again.");
          checkoutBtn.innerText = originalText;
          checkoutBtn.disabled = false;
        }
      }

      // ── Mobile menu ───────────────────────────────────────────────────────────

      const mobileToggle = document.getElementById("mobile-toggle");
      const mobileMenuOverlay = document.getElementById("mobile-menu-overlay");

      function openMobileMenu() {
        if (!mobileMenuOverlay) return;
        mobileMenuOverlay.classList.remove("hidden");
        requestAnimationFrame(() => mobileMenuOverlay.classList.add("open"));
      }

      function closeMobileMenu() {
        if (!mobileMenuOverlay) return;
        mobileMenuOverlay.classList.remove("open");
        setTimeout(() => mobileMenuOverlay.classList.add("hidden"), 300);
      }

      // ── Init ─────────────────────────────────────────────────────────────────

      applyURLParams();
      setupLangPills();
      renderChannels();
      updateCartUI();

      if (cartBtn) cartBtn.addEventListener("click", openCart);
      if (closeCartBtn) closeCartBtn.addEventListener("click", closeCart);
      if (cartOverlay)
        cartOverlay.addEventListener("click", (e) => {
          if (e.target === cartOverlay) closeCart();
        });
      if (checkoutBtn) checkoutBtn.addEventListener("click", handleCheckout);

      if (mobileToggle && mobileMenuOverlay) {
        mobileToggle.addEventListener("click", openMobileMenu);
        mobileMenuOverlay.addEventListener("click", (e) => {
          if (e.target === mobileMenuOverlay) closeMobileMenu();
        });
        const closeMobileBtn = mobileMenuOverlay.querySelector(
          ".mobile-menu__close",
        );
        const menuLinks = mobileMenuOverlay.querySelectorAll(
          ".mobile-menu__links a",
        );
        if (closeMobileBtn)
          closeMobileBtn.addEventListener("click", closeMobileMenu);
        menuLinks.forEach((link) =>
          link.addEventListener("click", closeMobileMenu),
        );
      }

      window.addEventListener("storage", (e) => {
        if (e.key === "kahani_cart") {
          cart = JSON.parse(e.newValue) || [];
          updateCartUI();
        }
      });

      // ── Floating hearts ───────────────────────────────────────────────────────

      window.addEventListener("load", () => {
        const iconSrc = "https://img.icons8.com/color/96/like--v1.png";
        for (let i = 0; i < 14; i++) {
          const icon = document.createElement("img");
          icon.src = iconSrc;
          icon.classList.add("heart");
          icon.alt = "";
          icon.setAttribute("aria-hidden", "true");
          icon.style.left = Math.random() * 100 + "vw";
          icon.style.animationDelay = Math.random() * 10 + "s";
          icon.style.width = (16 + Math.random() * 10).toFixed(2) + "px";
          icon.style.animationDuration =
            (7 + Math.random() * 5).toFixed(2) + "s";
          document.body.appendChild(icon);
        }
      });
    </script>
    <script src="/assets/js/navbar-loader.js" defer></script>
    <script src="/assets/js/footer-loader.js" defer></script>
  </body>
</html>
