      // --------- CATEGORY LABELS (UPDATED) ---------
      const CATEGORY_LABELS = {
        Playgroup: "Playgroup",
        Nursery: "Nursery",
        KG: "KG",
        Beginner: "Beginner",
        Letters: "Letters",
        Writing: "Writing",
        Stories: "Stories",
        Islamiat: "Islamiat",
        Grammar: "Grammar",
        Comprehension: "Comprehension",
        Workbook: "Workbook",
        "Class 1": "Class 1",
        Math: "Math",
        "General Knowledge": "GK",

        // new
        "Digital Book": "Digital Books",
        "PDF Handouts": "PDF Handouts",
        Quiz: "Quizzes",
        Flashcards: "Flashcards",
      };

      function getCategoryLabel(category) {
        return CATEGORY_LABELS[category] || category || "Other";
      }

      // --------- GRID / FILTER ----------
      const grid = document.querySelector(".grid");

      function slugifyCategory(str) {
        return String(str || "")
          .toLowerCase()
          .trim()
          .replace(/&/g, "and")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      // --------- PDF.js Worker (SET ONCE) ----------
      if (window.pdfjsLib?.GlobalWorkerOptions) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.js";
      }

      // --------- PDF THUMBNAIL (first page render using PDF.js) ----------
      async function renderFirstPageToImage(pdfUrl, imgEl) {
        try {
          const loadingTask = pdfjsLib.getDocument(pdfUrl);
          const pdf = await loadingTask.promise;
          const page = await pdf.getPage(1);

          const viewport = page.getViewport({ scale: 0.8 });
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          await page.render({ canvasContext: ctx, viewport }).promise;
          imgEl.src = canvas.toDataURL("image/png");
        } catch (err) {
          console.warn("PDF thumbnail failed:", pdfUrl, err);
          imgEl.src = "https://img.icons8.com/color/96/pdf.png";
        }
      }

      function getThumbForItem(item) {
        if (item.type === "pdf")
          return "https://img.icons8.com/color/96/pdf.png";
        if (item.category === "Flashcards")
          return "https://img.icons8.com/color/96/flash-cards.png";
        if (item.category === "Quiz")
          return "https://img.icons8.com/color/96/test.png";
        if (item.category === "Digital Book")
          return "https://img.icons8.com/color/96/book.png";
        if (item.category === "PDF Handouts")
          return "https://img.icons8.com/color/96/documents.png";
        return "https://img.icons8.com/color/96/link--v1.png";
      }

      function getTypeLabel(item) {
        if (item.type === "pdf") return "PDF";
        if (item.category === "Quiz") return "QUIZ";
        if (item.category === "Flashcards") return "FLASHCARDS";
        if (item.category === "Digital Book") return "DIGITAL";
        if (item.category === "PDF Handouts") return "HANDOUTS";
        return "LINK";
      }

      function renderPDFs() {
        if (!grid) return;
        grid.innerHTML = "";

        pdfList.forEach((item) => {
          const catSlug = slugifyCategory(item.category);

          const wrapper = document.createElement("div");
          wrapper.className = "video-wrapper video";
          wrapper.dataset.category = catSlug;
          wrapper.dataset.language = item.language || "Urdu";

          const link = document.createElement("a");
          link.className = "video-link";
          link.href = item.file;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          const banner = document.createElement("img");
          banner.className = "video-thumb";
          banner.alt = item.name;
          banner.src = getThumbForItem(item); // default

          link.appendChild(banner);
          wrapper.appendChild(link);

          const body = document.createElement("div");
          body.className = "video-body";

          const title = document.createElement("div");
          title.className = "video-title";
          title.textContent = item.name;

          const meta = document.createElement("div");
          meta.className = "video-meta";

          const type = document.createElement("div");
          type.className = "video-type";
          type.textContent = getTypeLabel(item);

          const chip = document.createElement("div");
          chip.className = "chip";
          chip.textContent = getCategoryLabel(item.category);

          meta.appendChild(type);
          meta.appendChild(chip);

          const desc = document.createElement("div");
          desc.className = "translation";
          desc.textContent = item.description || "";

          body.appendChild(title);
          body.appendChild(meta);
          body.appendChild(desc);

          wrapper.appendChild(body);
          grid.appendChild(wrapper);

          // Only render thumbnail via PDF.js for local PDFs
          if (item.type === "pdf") {
            renderFirstPageToImage(item.file, banner);
          }
        });
      }

      function init() {
        renderPDFs();
      }


      // floating hearts
      window.addEventListener("load", () => {
        document.body.classList.add("loaded");

          icon.style.width = (16 + Math.random() * 10).toFixed(2) + "px";
          icon.style.animationDuration =
            (7 + Math.random() * 5).toFixed(2) + "s";
          document.body.appendChild(icon);
        }

        init();
      });
