    <style>
      .coming-soon-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 4rem 1.5rem 5rem;
        gap: 1.25rem;
      }

      .coming-soon-icon {
        font-size: 3.5rem;
        color: var(--rosy-taupe, #d49797);
        line-height: 1;
      }

      .coming-soon-badge {
        display: inline-block;
        background: var(--soft-blush, #f3dedd);
        color: var(--granite, #4a594a);
        border: 1.5px solid var(--rosy-taupe, #d49797);
        border-radius: 999px;
        padding: 0.3rem 1rem;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .coming-soon-wrap h1 {
        margin: 0;
      }

      .coming-soon-wrap p {
        max-width: 520px;
        color: var(--muted, #5c6b68);
        line-height: 1.7;
        margin: 0;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 0.5rem;
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--hookers-green, #687d70);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .back-link:hover {
        color: var(--feldgrau, #4a594a);
      }
    </style>
