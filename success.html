<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Confirmed — Kahani Korner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --granite: #4a594a;
      --deep-teal: #687d70;
      --soft-blush: #f3dedd;
      --rosy-taupe: #d49797;
      --white-smoke: #f3f1f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Open Sans", sans-serif;
      background: var(--white-smoke);
      color: var(--granite);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: white;
      border: 2px solid #b0c3b7;
      border-radius: 2rem;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 18px 40px rgba(74,89,74,0.12);
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: "Grandstander", cursive;
      font-size: 2rem;
      color: var(--granite);
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--deep-teal);
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    a {
      display: inline-block;
      padding: 0.9rem 2rem;
      background: var(--granite);
      color: white;
      border-radius: 1rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 0 var(--deep-teal);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--deep-teal);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>Order Confirmed!</h1>
    <p>Thank you for your purchase from Kahani Korner.<br>You'll receive a confirmation email shortly.</p>
    <a href="/products.html">Continue Shopping</a>
  </div>
  <script>
    // Clear the cart after successful payment
    localStorage.removeItem("kahani_cart");
  </script>
</body>
</html>
